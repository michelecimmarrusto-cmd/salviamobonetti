name: Aggiorna il contatore delle firme

# Due volte al giorno: verso le 8:10 e le 16:10, ora italiana (orario invernale).
on:
  schedule:
    - cron: "10 7 * * *"
    - cron: "10 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-firme
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Leggi le firme dal portale del Comune e aggiorna la pagina
        run: python3 strumenti/aggiorna_firme.py

      - name: Pubblica se è cambiato qualcosa
        run: |
          if git diff --quiet; then
            echo "Nessuna variazione da pubblicare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Aggiorna il contatore delle firme"
          git push
